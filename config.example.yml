# ──────────────────────────────────────────────────────────────
# hanati-pretrain-data-validator 설정 파일 전체 스펙
# 사용법: --config config.yml (기본값: config.yml)
# ──────────────────────────────────────────────────────────────

api:
  # [필수] OpenAI-compatible API 엔드포인트 (trailing slash 없이)
  base_url: "http://localhost:8000/v1"

  # 사용할 모델 ID. 생략하면 base_url/models 에서 첫 번째 모델을 자동으로 사용
  model: "your-model-name"

  # API 인증 키. 로컬 vLLM 등 인증이 필요 없는 서버는 생략 가능 (기본: null)
  # api_key: "sk-..."

  # 동시에 보낼 최대 요청 수 (기본: 256)
  concurrency: 32

  # API 호출 타임아웃 (초 단위, 기본: 120.0)
  timeout: 120.0


generation:
  # ── 아래 모든 항목은 선택 사항입니다 ──────────────────────────
  # 생략하면 해당 파라미터를 API 요청에 포함하지 않으며,
  # 서버(모델)의 기본값이 그대로 적용됩니다.

  # 생성할 최대 토큰 수
  max_tokens: 1024

  # 샘플링 온도. 높을수록 다양성 증가 (0.0 = greedy)
  temperature: 1.0

  # nucleus sampling 확률 누적 임계값 (0.0 ~ 1.0)
  top_p: 1.0

  # top-k sampling. 상위 k개 토큰만 후보로 사용 (vLLM 전용 extra_body)
  # -1 = 비활성화, 1 = greedy (top-1), 2 이상 = 상위 k개 후보에서 샘플링
  top_k: 50

  # 반복 패널티. 1.0 = 패널티 없음, >1.0 = 반복 억제 (vLLM 전용 extra_body)
  repetition_penalty: 1.0

  # 재현성을 위한 시드값. 동일 시드 + 동일 입력이면 동일 출력
  seed: 42
